<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Productos</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between text-gray-800 font-sans">

  <!-- Encabezado -->
  <header class="bg-blue-600 text-white py-6 px-4 text-center shadow-md">
    <h1 class="text-3xl font-bold">Mi Tienda Online</h1>
    <p class="text-blue-100 mt-1">Los mejores productos al mejor precio</p>
  </header>

  <!-- Contenido principal con el contenedor vacío para JS -->
  <main class="max-w-6xl mx-auto p-6 w-full flex-grow">
    <h2 class="text-2xl font-semibold mb-6 text-gray-700">Nuestro Catálogo</h2>
    
    <!-- El div id="catalogo" queda vacío para que JavaScript cree las tarjetas aquí -->
    <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </main>

  <!-- Pie de página -->
  <footer class="bg-gray-800 text-gray-300 py-4 text-center text-sm">
    <p>Desarrollado por el Equipo de Proyecto</p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
